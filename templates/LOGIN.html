<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHUB - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-container">
        <a href="/" class="login-back">&larr; Voltar</a>

        <div class="login-card login-card-anim">
            <div class="logo login-logo">
                CAMPUS<span class="logo-white">.HUB</span>
            </div>

            <div class="login-tabs">
                <div class="login-tab">Entrar</div>
            </div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <p style="color:#f87171; font-size:0.85rem; margin-bottom:1rem;">{{ messages[0] }}</p>
                {% endif %}
            {% endwith %}

            <form method="post" action="/login">
                <div class="login-field">
                    <label class="login-label">Usuário</label>
                    <input type="text" name="login" placeholder="Ex: admin" class="login-input" required />
                </div>

                <div class="login-field">
                    <label class="login-label">Senha</label>
                    <input type="password" name="senha" placeholder="••••••••••••" class="login-input" required />
                    <a href="/solicitar-acesso" class="login-forgot">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-gradient login-btn" style="border:none; cursor:pointer; width:100%;">
                    Acessar Sistema
                </button>
            </form>

            <hr class="login-divider" />

            <div class="login-footer">
                Não tem acesso? <a href="/solicitar-acesso">Solicite ao administrador</a>.
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/particles-bg.js') }}"></script>
    <script src="{{ url_for('static', filename='js/animations.js') }}"></script>
</body>
</html>
