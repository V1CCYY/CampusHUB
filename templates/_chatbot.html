{% if logado_id %}
<div id="campusbot" class="cb-root">
    <button type="button" class="cb-toggle" aria-label="Abrir CampusBot" aria-expanded="false" aria-controls="cbPanel">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 11h.01M15 11h.01"/></svg>
    </button>
    <section id="cbPanel" class="cb-panel" role="dialog" aria-label="CampusBot, assistente do sistema" hidden>
        <header class="cb-head">
            <strong>CampusBot</strong>
            <span class="cb-sub">assistente do CampusHUB</span>
            <button type="button" class="cb-clear" aria-label="Limpar conversa">Limpar</button>
            <button type="button" class="cb-close" aria-label="Fechar">&times;</button>
        </header>
        <div class="cb-log" role="log" aria-live="polite"></div>
        <div class="cb-opts"></div>
        <form class="cb-form" autocomplete="off">
            <input type="text" class="cb-input" placeholder="Digite uma mensagem…" maxlength="300" aria-label="Mensagem para o CampusBot">
            <button type="submit" class="cb-send">Enviar</button>
        </form>
    </section>
</div>
<script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
{% endif %}
